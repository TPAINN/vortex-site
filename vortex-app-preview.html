<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Vortex — app preview</title>
    <style>
      /*
        A live, interactive spec for the new Vortex app UI. Everything here is a
        design review, not the shipped app — but every interaction the brief
        described is real and tappable so the feel can be judged before a line of
        Kotlin is written: splash, particle-wave background, the centred search
        bar that expands on focus, paste underneath, link-detection that hides
        paste + shrinks + lifts the bar with the source preview appearing below,
        the four themes behind the gear, and the history screen with a back arrow.
      */
      :root {
        /* Dark (default) — a professional near-black indigo, not pure black. */
        --bg: #0e0f17;
        --bg-2: #161826;
        --surface: #1b1e30;
        --surface-2: #232741;
        --line: #2c3050;
        --ink: #eef0fb;
        --ink-2: #a7abce;
        --ink-3: #6b6f95;
        --accent: #7c6cff;
        --accent-2: #9b8cff;
        --on-accent: #ffffff;
        --particle: 124, 108, 255;
        --radius: 20px;
        --radius-sm: 14px;
      }
      .phone[data-theme="amoled"] {
        --bg: #000000;
        --bg-2: #070709;
        --surface: #0d0d12;
        --surface-2: #16161d;
        --line: #23232e;
        --ink: #f4f4f8;
        --ink-2: #9a9aae;
        --ink-3: #5c5c70;
        --accent: #8a7bff;
        --accent-2: #a99cff;
        --particle: 138, 123, 255;
      }
      .phone[data-theme="light"] {
        --bg: #f4f4fb;
        --bg-2: #ffffff;
        --surface: #ffffff;
        --surface-2: #f0f0f8;
        --line: #e2e2ef;
        --ink: #1a1b2e;
        --ink-2: #5a5c78;
        --ink-3: #9a9cb6;
        --accent: #6355e6;
        --accent-2: #7a6cf0;
        --on-accent: #ffffff;
        --particle: 99, 85, 230;
      }
      .phone[data-theme="materialu"] {
        --bg: #f7f2fa;
        --bg-2: #fffbfe;
        --surface: #fffbfe;
        --surface-2: #ece6f0;
        --line: #e6dfeb;
        --ink: #1d1b20;
        --ink-2: #49454f;
        --ink-3: #7a757f;
        --accent: #6750a4;
        --accent-2: #7f67be;
        --on-accent: #ffffff;
        --particle: 103, 80, 164;
        --radius: 28px;
        --radius-sm: 20px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #05050a;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      /* Phone frame so the review reads as an app, not a web page. */
      .phone {
        position: relative;
        width: min(400px, 100vw);
        height: min(860px, 100vh);
        background: var(--bg);
        overflow: hidden;
        transition: background 0.5s ease;
        color: var(--ink);
        display: flex;
        flex-direction: column;
      }
      @media (min-width: 420px) and (min-height: 880px) {
        .phone { border-radius: 44px; box-shadow: 0 30px 90px rgba(0,0,0,0.6); border: 1px solid #1a1a24; }
      }

      canvas#waves { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }

      /* ── Splash ── */
      .splash {
        position: absolute; inset: 0; z-index: 40;
        background: var(--bg);
        display: grid; place-items: center;
        transition: opacity 0.6s ease, visibility 0.6s;
      }
      .splash.gone { opacity: 0; visibility: hidden; }
      .splash-mark {
        width: 74px; height: 74px; position: relative;
        animation: spin 2.4s cubic-bezier(0.5,0,0.2,1) infinite;
      }
      .ring { position: absolute; inset: 0; border-radius: 50%; border: 6px solid transparent; }
      .ring.outer { border-color: var(--accent); opacity: 0.9; }
      .ring.inner { inset: 16px; border-top-color: var(--accent-2); border-right-color: var(--accent-2); }
      @keyframes spin { to { transform: rotate(360deg); } }
      .splash-word {
        position: absolute; margin-top: 128px;
        font-weight: 800; letter-spacing: 6px; font-size: 15px; color: var(--ink-2);
        opacity: 0; animation: fadeUp 0.9s ease 0.4s forwards;
      }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 0.9; transform: none; } }

      /* ── Top bar ── */
      .topbar {
        position: relative; z-index: 10;
        display: flex; align-items: center; justify-content: space-between;
        padding: 22px 22px 0;
      }
      .brand { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
      .brand b { color: var(--accent); }
      .top-actions { display: flex; gap: 8px; }
      .icon-btn {
        width: 42px; height: 42px; border-radius: 13px;
        background: var(--surface); border: 1px solid var(--line);
        display: grid; place-items: center; color: var(--ink-2);
        cursor: pointer; transition: transform 0.15s, border-color 0.2s, color 0.2s;
      }
      .icon-btn:active { transform: scale(0.92); }
      .icon-btn svg { width: 19px; height: 19px; }

      /* ── Main area ── */
      .stage { position: relative; z-index: 10; flex: 1; display: flex; flex-direction: column; }

      /* The centred search zone. It starts vertically centred and lifts up when a
         link is recognised — driven by justify-content on this flex column. */
      .search-zone {
        flex: 1; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; padding: 0 22px;
        transition: justify-content 0.6s cubic-bezier(0.22,1,0.36,1);
      }
      .phone[data-mode="preview"] .search-zone { justify-content: flex-start; padding-top: 20px; }

      .search-wrap { width: 100%; max-width: 340px; transition: max-width 0.6s cubic-bezier(0.22,1,0.36,1); }
      .phone[data-mode="preview"] .search-wrap { max-width: 300px; }

      .search {
        display: flex; align-items: center; gap: 12px;
        background: var(--surface); border: 1.5px solid var(--line);
        border-radius: 16px; padding: 0 16px; height: 58px;
        transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s, height 0.4s;
      }
      .search.focused {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(var(--particle), 0.14), 0 8px 30px rgba(var(--particle), 0.18);
      }
      .phone[data-mode="preview"] .search { height: 50px; }
      .search svg.mag { width: 20px; height: 20px; color: var(--ink-3); flex-shrink: 0; transition: color 0.3s; }
      .search.focused svg.mag { color: var(--accent); }
      .search input {
        flex: 1; background: none; border: none; outline: none;
        color: var(--ink); font-size: 15.5px; font-family: inherit;
      }
      .search input::placeholder { color: var(--ink-3); }
      .search .clear { color: var(--ink-3); cursor: pointer; display: none; }
      .search input:not(:placeholder-shown) ~ .clear { display: block; }

      /* Paste sits under the bar and hides once the user is typing a link. */
      .paste {
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--surface-2); border: 1px solid var(--line);
        color: var(--ink-2); font-weight: 600; font-size: 14px;
        padding: 12px 22px; border-radius: 13px; cursor: pointer;
        transition: opacity 0.3s, transform 0.3s, background 0.2s;
      }
      .paste:active { transform: scale(0.95); }
      .paste svg { width: 16px; height: 16px; }
      .paste.hidden { opacity: 0; transform: translateY(-6px); pointer-events: none; }

      .hint { color: var(--ink-3); font-size: 12.5px; letter-spacing: 0.3px; }
      .paste.hidden ~ .hint { display: none; }

      /* ── Source preview ── */
      .preview {
        width: 100%; max-width: 340px; margin: 20px auto 0;
        opacity: 0; transform: translateY(16px); pointer-events: none;
        transition: opacity 0.5s ease 0.15s, transform 0.5s cubic-bezier(0.22,1,0.36,1) 0.15s;
      }
      .phone[data-mode="preview"] .preview { opacity: 1; transform: none; pointer-events: auto; }
      .preview-card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius); overflow: hidden;
      }
      .thumb {
        height: 158px; background: linear-gradient(135deg, var(--surface-2), var(--surface));
        position: relative; display: grid; place-items: center;
      }
      .thumb .platform {
        position: absolute; top: 12px; left: 12px;
        background: rgba(0,0,0,0.55); color: #fff; backdrop-filter: blur(6px);
        font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
        padding: 5px 11px; border-radius: 999px; text-transform: uppercase;
      }
      .thumb .badge18 {
        position: absolute; top: 12px; right: 12px;
        background: #ef5b6b; color: #fff; font-size: 10.5px; font-weight: 800;
        padding: 5px 9px; border-radius: 8px; display: none;
      }
      .thumb.age .badge18 { display: block; }
      .thumb .glyph { width: 46px; height: 46px; color: var(--ink-3); }
      .thumb.nodl { opacity: 0.82; }
      .meta { padding: 15px 16px 6px; }
      .meta .title { font-weight: 700; font-size: 15px; line-height: 1.3; }
      .meta .sub { color: var(--ink-3); font-size: 12.5px; margin-top: 4px; }
      .methods { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px; }
      .method {
        display: flex; align-items: center; gap: 12px;
        background: var(--surface-2); border: 1px solid var(--line);
        border-radius: var(--radius-sm); padding: 13px 15px; cursor: pointer;
        transition: transform 0.15s, border-color 0.2s;
      }
      .method:active { transform: scale(0.98); }
      .method.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
      .method .m-ic { width: 20px; height: 20px; flex-shrink: 0; }
      .method .m-main { flex: 1; }
      .method .m-t { font-weight: 700; font-size: 14px; }
      .method .m-s { font-size: 12px; opacity: 0.75; margin-top: 1px; }
      .method .dl { width: 18px; height: 18px; opacity: 0.8; }
      .note-row {
        display: flex; align-items: center; gap: 11px;
        background: var(--surface-2); border: 1px dashed var(--line);
        border-radius: var(--radius-sm); padding: 13px 15px;
        color: var(--ink-2); font-size: 12.5px; line-height: 1.4;
      }
      .note-row svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--ink-3); }

      /* ── History screen ── */
      .history {
        position: absolute; inset: 0; z-index: 20;
        background: var(--bg); transform: translateX(100%);
        transition: transform 0.5s cubic-bezier(0.22,1,0.36,1);
        display: flex; flex-direction: column;
      }
      .history.open { transform: none; }
      .history .h-top { display: flex; align-items: center; gap: 14px; padding: 22px 22px 8px; }
      .history .h-top .title { font-weight: 800; font-size: 20px; }
      .h-list { flex: 1; overflow-y: auto; padding: 10px 18px 20px; display: flex; flex-direction: column; gap: 10px; }
      .h-item {
        display: flex; align-items: center; gap: 13px;
        background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius-sm); padding: 13px 15px;
      }
      .h-item .h-thumb { width: 46px; height: 46px; border-radius: 11px; background: var(--surface-2); flex-shrink: 0; display:grid; place-items:center; }
      .h-item .h-thumb svg { width: 20px; height: 20px; color: var(--ink-3); }
      .h-item .h-main { flex: 1; min-width: 0; }
      .h-item .h-t { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .h-item .h-s { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
      .h-item .h-plat { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }

      /* ── Theme sheet ── */
      .scrim {
        position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,0.5);
        opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s;
      }
      .scrim.open { opacity: 1; visibility: visible; }
      .sheet {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 31;
        background: var(--bg-2); border-top-left-radius: 26px; border-top-right-radius: 26px;
        border-top: 1px solid var(--line);
        transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
        padding: 12px 20px 30px;
      }
      .sheet.open { transform: none; }
      .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 6px auto 16px; }
      .sheet h3 { font-size: 16px; margin-bottom: 4px; }
      .sheet p { font-size: 12.5px; color: var(--ink-3); margin-bottom: 16px; }
      .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
      .theme-opt {
        display: flex; align-items: center; gap: 11px;
        border: 1.5px solid var(--line); border-radius: var(--radius-sm);
        padding: 13px 14px; cursor: pointer; transition: border-color 0.2s;
      }
      .theme-opt.active { border-color: var(--accent); }
      .swatch { width: 30px; height: 30px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
      .theme-opt .t-name { font-weight: 600; font-size: 13.5px; }
      .theme-opt .check { margin-left: auto; color: var(--accent); opacity: 0; }
      .theme-opt.active .check { opacity: 1; }

      /* Small helper so the search-animation ref is visibly honoured: the bar
         width springs in on focus. */
      @keyframes barPop { 0% { transform: scale(0.97); } 60% { transform: scale(1.015); } 100% { transform: scale(1); } }
      .search.focused { animation: barPop 0.45s cubic-bezier(0.22,1,0.36,1); }
    </style>
  </head>
  <body>
    <div class="phone" id="phone" data-theme="dark" data-mode="idle">
      <canvas id="waves"></canvas>

      <!-- Splash -->
      <div class="splash" id="splash">
        <div class="splash-mark"><div class="ring outer"></div><div class="ring inner"></div></div>
        <div class="splash-word">VORTEX</div>
      </div>

      <!-- Top bar -->
      <div class="topbar">
        <div class="brand">Vor<b>tex</b></div>
        <div class="top-actions">
          <div class="icon-btn" id="historyBtn" title="History" aria-label="History">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 3"/></svg>
          </div>
          <div class="icon-btn" id="gearBtn" title="Themes" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </div>
        </div>
      </div>

      <!-- Main -->
      <div class="stage">
        <div class="search-zone">
          <div class="search-wrap">
            <div class="search" id="search">
              <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="input" type="text" placeholder="Paste or type a link…" autocomplete="off" spellcheck="false" />
              <svg class="clear" id="clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </div>
          </div>
          <button class="paste" id="pasteBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
            Paste link
          </button>
          <div class="hint">on-device · no account · no watermark</div>

          <!-- Source preview -->
          <div class="preview" id="preview">
            <div class="preview-card">
              <div class="thumb" id="thumb">
                <span class="platform" id="platform">Media</span>
                <span class="badge18">18+ verified</span>
                <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m10 8 6 4-6 4V8Z"/><rect x="2" y="3" width="20" height="18" rx="3"/></svg>
              </div>
              <div class="meta">
                <div class="title" id="pvTitle">Detecting source…</div>
                <div class="sub" id="pvSub">Reading the link on-device</div>
              </div>
              <div class="methods" id="methods"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- History screen -->
      <div class="history" id="history">
        <div class="h-top">
          <div class="icon-btn" id="backBtn" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          </div>
          <div class="title">History</div>
        </div>
        <div class="h-list" id="hList"></div>
      </div>

      <!-- Theme sheet -->
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet">
        <div class="grip"></div>
        <h3>Theme</h3>
        <p>Pick how Vortex looks. The particle background adapts to each.</p>
        <div class="themes" id="themeGrid">
          <div class="theme-opt" data-t="dark"><span class="swatch" style="background:#0e0f17"></span><span class="t-name">Dark</span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m20 6-11 11-5-5"/></svg></div>
          <div class="theme-opt" data-t="amoled"><span class="swatch" style="background:#000"></span><span class="t-name">AMOLED</span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m20 6-11 11-5-5"/></svg></div>
          <div class="theme-opt" data-t="light"><span class="swatch" style="background:#f4f4fb"></span><span class="t-name">Light</span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m20 6-11 11-5-5"/></svg></div>
          <div class="theme-opt" data-t="materialu"><span class="swatch" style="background:linear-gradient(135deg,#6750a4,#f7f2fa)"></span><span class="t-name">Material U</span><svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m20 6-11 11-5-5"/></svg></div>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const phone = $("phone");

      // ── Splash ──
      setTimeout(() => $("splash").classList.add("gone"), 1500);

      // ── Particle-wave background ──
      // A slow, minimal field of drifting dots joined by faint lines — reads well
      // on both dark and light grounds because it draws with the theme's accent.
      const canvas = $("waves"), ctx = canvas.getContext("2d");
      let W, H, dots = [];
      function resize() {
        const r = phone.getBoundingClientRect();
        W = canvas.width = r.width * devicePixelRatio;
        H = canvas.height = r.height * devicePixelRatio;
        canvas.style.width = r.width + "px"; canvas.style.height = r.height + "px";
        const count = Math.round((r.width * r.height) / 14000);
        dots = Array.from({ length: count }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.12 * devicePixelRatio,
          vy: (Math.random() - 0.5) * 0.12 * devicePixelRatio,
          r: (Math.random() * 1.4 + 0.6) * devicePixelRatio,
        }));
      }
      function tick() {
        const c = getComputedStyle(phone).getPropertyValue("--particle").trim();
        ctx.clearRect(0, 0, W, H);
        for (const d of dots) {
          d.x += d.vx; d.y += d.vy;
          if (d.x < 0 || d.x > W) d.vx *= -1;
          if (d.y < 0 || d.y > H) d.vy *= -1;
        }
        // Links
        for (let i = 0; i < dots.length; i++) {
          for (let j = i + 1; j < dots.length; j++) {
            const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
            const dist = Math.hypot(dx, dy), max = 120 * devicePixelRatio;
            if (dist < max) {
              ctx.strokeStyle = `rgba(${c}, ${(1 - dist / max) * 0.12})`;
              ctx.lineWidth = devicePixelRatio * 0.6;
              ctx.beginPath(); ctx.moveTo(dots[i].x, dots[i].y); ctx.lineTo(dots[j].x, dots[j].y); ctx.stroke();
            }
          }
        }
        for (const d of dots) {
          ctx.fillStyle = `rgba(${c}, 0.5)`;
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      resize(); tick();
      window.addEventListener("resize", resize);

      // ── Search focus animation ──
      const search = $("search"), input = $("input"), paste = $("pasteBtn");
      input.addEventListener("focus", () => search.classList.add("focused"));
      input.addEventListener("blur", () => { if (!input.value) search.classList.remove("focused"); });
      $("clear").addEventListener("click", () => { input.value = ""; input.dispatchEvent(new Event("input")); input.focus(); });

      // ── URL normalization ──
      // Real pastes are messy: no scheme, stray whitespace, zero-width chars
      // copied from chat apps, tracking params. Resolve to a real URL object
      // (not a whole-string regex — that's how "https://evil.com/?u=youtube.com"
      // used to false-match YouTube) or return null.
      function normalizeUrl(raw) {
        const ZW_RE = new RegExp("[" + String.fromCharCode(8203) + "-" + String.fromCharCode(8205) + String.fromCharCode(65279) + "]", "g");
        let t = (raw || "").trim().replace(ZW_RE, "");
        if (!t) return null;
        if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(t)) {
          if (/^[\w-]+(\.[\w-]+)+([/?#]|$)/i.test(t)) t = "https://" + t;
          else return null;
        }
        try {
          const u = new URL(t);
          return /^https?:$/.test(u.protocol) ? u : null;
        } catch { return null; }
      }
      const bareHost = (u) => u.hostname.replace(/^(www|m|mobile|web)\./, "");
      const segs = (u) => u.pathname.split("/").filter(Boolean);
      const looksLikeLink = (t) => !!normalizeUrl(t);

      // ── Method-set + result shapes ──
      const METHOD_SETS = {
        video: (q = "1080p") => [[`Video · ${q}`, "MP4 · no watermark", true], ["Audio only", "MP3 · 320 kbps", false]],
        videoOnly: (q = "best") => [[`Video · ${q}`, "MP4", true]],
        audio: (q = "320 kbps") => [["Audio", `MP3 · ${q} + tags`, true]],
        auto: () => [["Best quality", "Photo or video, auto-detected", true], ["Audio only", "If the post has video", false]],
        imageSet: () => [["Photos", "Original quality, ZIP if multiple", true], ["Audio", "Background track, if any", false]],
        direct: () => [["Direct file", "Original quality, as hosted", true]],
      };
      const media = (type, title, sub, methods, opts = {}) =>
        ({ downloadable: true, type, title, sub, methods, glyph: type, ...opts });
      const unsupported = (title, note) =>
        ({ downloadable: false, type: "unsupported", title, sub: "No downloadable media here", note, methods: [], glyph: "locked" });

      // ── Platform recognition ──
      // Each entry matches on the real hostname, then classifies by path shape
      // into either a downloadable media type or an honest "not downloadable"
      // result (profile/community/channel pages, DRM'd catalog links, etc.)
      // rather than faking a download button for a page with nothing to fetch.
      const PLATFORMS = [
        { name: "TikTok", match: (h) => h === "tiktok.com" || h === "vm.tiktok.com" || h === "vt.tiktok.com",
          classify(u, h, p) {
            if (h === "vm.tiktok.com" || h === "vt.tiktok.com") return media("video", "TikTok · shared link", "Resolves to video or photo post", METHOD_SETS.video());
            if (p[1] === "video" && p[2]) return media("video", `${p[0]} · video`, "TikTok · no watermark", METHOD_SETS.video());
            if (p[1] === "photo" && p[2]) return media("image", `${p[0]} · photo post`, "TikTok slideshow", METHOD_SETS.imageSet());
            if (p.length === 1 && p[0].startsWith("@")) return unsupported("TikTok profile", "Paste a link to a specific video or photo post instead");
            return unsupported("TikTok page", "No downloadable media on this page");
          } },
        { name: "YouTube", match: (h) => h === "youtube.com" || h === "youtu.be" || h === "music.youtube.com",
          classify(u, h, p) {
            const music = h === "music.youtube.com";
            if (h === "youtu.be" && p[0]) return media("video", music ? "YouTube Music track" : "YouTube video", "Shared link", music ? METHOD_SETS.audio() : METHOD_SETS.video());
            if (p[0] === "shorts" && p[1]) return media("video", "YouTube Shorts", "Vertical video", METHOD_SETS.video());
            if (p[0] === "watch" && u.searchParams.get("v")) return music
              ? media("audio", "YouTube Music track", "Tagged with cover art", METHOD_SETS.audio())
              : media("video", "YouTube video", "Standard upload", [["Video · 1080p", "MP4 · H.264", true], ["Video · 720p", "MP4 · smaller", false], ["Audio only", "MP3 · 320 kbps", false]]);
            if (p[0] === "playlist") return unsupported("YouTube playlist", "Paste a link to an individual video instead");
            if (p[0] === "channel" || (p[0] || "").startsWith("@")) return unsupported("YouTube channel", "Paste a link to a specific video instead");
            return unsupported("YouTube", "No downloadable media detected");
          } },
        { name: "Instagram", match: (h) => h === "instagram.com",
          classify(u, h, p) {
            if (p[0] === "p" && p[1]) return media("video", "Instagram post", "Photo or video · quality preserved", METHOD_SETS.auto());
            if ((p[0] === "reel" || p[0] === "reels") && p[1]) return media("video", "Instagram Reel", "Vertical video", METHOD_SETS.video());
            if (p[0] === "tv" && p[1]) return media("video", "IGTV video", "Long-form video", METHOD_SETS.video());
            if (p[0] === "stories" && p[1] && p[2]) return media("image", "Instagram story", `@${p[1]} · expires after 24h`, METHOD_SETS.auto());
            if (p[0] === "explore") return unsupported("Instagram discovery", "No downloadable media on this page");
            if (p.length === 1) return unsupported("Instagram profile", "Paste a link to a specific post or reel instead");
            return unsupported("Instagram", "No downloadable media detected");
          } },
        { name: "Facebook", match: (h) => h === "facebook.com" || h === "fb.watch" || h === "fb.me",
          classify(u, h, p) {
            if (h === "fb.watch" || h === "fb.me") return media("video", "Facebook video", "Shared link", METHOD_SETS.video());
            if (u.pathname === "/sharer/sharer.php") return unsupported("Facebook share tool", "This is a share dialog, not a content link — paste the original post link");
            if (p[0] === "watch") return media("video", "Facebook video", "Watch page", METHOD_SETS.video());
            if (p[0] === "reel" && p[1]) return media("video", "Facebook Reel", "Vertical video", METHOD_SETS.video());
            if (p.includes("videos")) return media("video", "Facebook video", "Page video", METHOD_SETS.video());
            if (p.includes("posts") || u.searchParams.has("story_fbid")) return media("video", "Facebook post", "Photo or video, if attached", METHOD_SETS.auto());
            if (p[0] === "share") return media("video", "Facebook · shared link", "Resolves on-device", METHOD_SETS.video());
            if (p[0] === "groups" || p[0] === "events") return unsupported(`Facebook ${p[0] === "groups" ? "group" : "event"}`, "No downloadable media on this page");
            if (p.length >= 1) return unsupported("Facebook profile or page", "Paste a link to a specific video or post instead");
            return unsupported("Facebook", "No downloadable media detected");
          } },
        { name: "X", match: (h) => h === "x.com" || h === "twitter.com",
          classify(u, h, p) {
            if (p[1] === "status" && p[2]) return media("video", "X post", `@${p[0]} · media, if any`, METHOD_SETS.videoOnly());
            if (p[0] === "i") return unsupported("X system page", "No downloadable media on this page");
            if (p.length === 1) return unsupported("X / Twitter profile", "Paste a link to a specific post instead");
            return unsupported("X / Twitter", "No downloadable media detected");
          } },
        { name: "Reddit", match: (h) => h === "reddit.com",
          classify(u, h, p) {
            if (p[0] === "r" && p[2] === "comments") return media("video", "Reddit post", `r/${p[1]} · video merges audio automatically`, [["Video + audio", "MP4 merged", true], ["Audio only", "MP3", false]], { age: true });
            if (p[0] === "r" && p[2] === "s") return media("video", "Reddit · shared link", `r/${p[1]}`, METHOD_SETS.video(), { age: true });
            if (p[0] === "r") return unsupported(`r/${p[1] || ""}`, "This is a community page, not a post");
            if (p[0] === "user" || p[0] === "u") return unsupported("Reddit profile", "Paste a link to a specific post instead");
            return unsupported("Reddit", "No downloadable media detected");
          } },
        { name: "Pinterest", match: (h) => h === "pinterest.com" || h === "pin.it",
          classify(u, h, p) {
            if (h === "pin.it") return media("image", "Pinterest · shared pin", "Resolves on-device", METHOD_SETS.imageSet());
            if (p[0] === "pin" && p[1]) return media("image", "Pinterest pin", "Photo or video pin", METHOD_SETS.auto());
            if (p.length >= 2) return unsupported("Pinterest board", "This is a collection, not a single pin");
            if (p.length === 1) return unsupported("Pinterest profile", "Paste a link to a specific pin instead");
            return unsupported("Pinterest", "No downloadable media detected");
          } },
        { name: "LinkedIn", match: (h) => h === "linkedin.com",
          classify(u, h, p) {
            if (p[0] === "posts" || p[0] === "feed") return media("video", "LinkedIn post", "Video, if attached", METHOD_SETS.auto());
            if (p[0] === "in") return unsupported("LinkedIn profile", "Paste a link to a specific post instead");
            if (p[0] === "company") return unsupported("LinkedIn company page", "Paste a link to a specific post instead");
            if (p[0] === "events") return unsupported("LinkedIn event", "Live recordings aren't supported");
            return unsupported("LinkedIn", "No downloadable media detected");
          } },
        { name: "Snapchat", match: (h) => h === "snapchat.com",
          classify(u, h, p) {
            if (p[0] === "spotlight" || p[0] === "p") return media("video", "Snapchat Spotlight", "Public share", METHOD_SETS.video());
            if (p[0] === "add") return unsupported("Snapchat profile link", "This adds a friend — it isn't a content link");
            if (p[0] === "t") return media("video", "Snapchat · shared link", "Resolves on-device", METHOD_SETS.video());
            return unsupported("Snapchat", "No downloadable media detected");
          } },
        { name: "Discord", match: (h) => ["discord.gg", "discord.com", "cdn.discordapp.com", "media.discordapp.net"].includes(h),
          classify(u, h, p) {
            if (h === "cdn.discordapp.com" || h === "media.discordapp.net") return media("video", "Discord attachment", "Direct file link · original quality", METHOD_SETS.direct());
            if (h === "discord.gg" || p[0] === "invite") return unsupported("Discord invite", "This joins a server — it isn't a content link");
            if (p[0] === "channels") return unsupported("Discord channel", "Attachments are permission-gated and not publicly downloadable");
            return unsupported("Discord", "No downloadable media detected");
          } },
        { name: "Threads", match: (h) => h === "threads.com" || h === "threads.net",
          classify(u, h, p) {
            if (p[1] === "post" && p[2]) return media("video", "Threads post", `${p[0]} · media`, METHOD_SETS.auto());
            if (p.length === 1) return unsupported("Threads profile", "Paste a link to a specific post instead");
            return unsupported("Threads", "No downloadable media detected");
          } },
        { name: "Spotify", match: (h) => h === "open.spotify.com" || h === "spotify.com",
          classify(u, h, p) {
            if (p[0] === "track") return media("audio", "Spotify track", "Matched + fetched via YouTube", METHOD_SETS.audio());
            if (p[0] === "episode") return media("audio", "Spotify episode", "Podcast episode", METHOD_SETS.audio());
            if (["album", "playlist", "show"].includes(p[0])) return unsupported(`Spotify ${p[0]}`, "DRM-protected — paste an individual track or episode link instead");
            if (p[0] === "artist" || p[0] === "user") return unsupported("Spotify profile", "Paste a link to a specific track instead");
            return unsupported("Spotify", "No downloadable media detected");
          } },
        { name: "SoundCloud", match: (h) => h === "soundcloud.com",
          classify(u, h, p) {
            if (p.length >= 2 && p[1] === "sets") return unsupported("SoundCloud playlist", "Paste a link to an individual track instead");
            if (p.length >= 2) return media("audio", "SoundCloud track", `${p[0]} · track`, METHOD_SETS.audio());
            return unsupported("SoundCloud profile", "Paste a link to a specific track instead");
          } },
        { name: "Twitch", match: (h) => h === "twitch.tv" || h === "clips.twitch.tv" || h === "m.twitch.tv",
          classify(u, h, p) {
            if (h === "clips.twitch.tv" && p[0]) return media("video", "Twitch clip", "Source quality", METHOD_SETS.videoOnly("source"));
            if (p[0] === "videos" && p[1]) return media("video", "Twitch VOD", "Full broadcast", METHOD_SETS.videoOnly());
            if (p.includes("clip")) return media("video", "Twitch clip", "Source quality", METHOD_SETS.videoOnly("source"));
            if (p.length === 1) return unsupported("Twitch channel", "Live streams aren't supported — paste a clip or VOD link");
            return unsupported("Twitch", "No downloadable media detected");
          } },
        { name: "Vimeo", match: (h) => h === "vimeo.com",
          classify(u, h, p) {
            if (/^\d+$/.test(p[0] || "")) return media("video", "Vimeo video", "Creator upload", METHOD_SETS.videoOnly("HD"));
            return unsupported("Vimeo page", "Paste a link to a specific video instead");
          } },
      ];

      function detectPlatform(raw) {
        const u = normalizeUrl(raw);
        if (!u) return null;
        const h = bareHost(u);
        const p = segs(u);
        const plat = PLATFORMS.find((pl) => pl.match(h));
        if (plat) return { name: plat.name, ...plat.classify(u, h, p) };
        // Unknown host: yt-dlp covers 1000+ extractors beyond the advertised
        // list, so a best-effort generic attempt is honest, not a lie.
        return { name: "Media", ...media("video", "Media source", "on-device extraction · yt-dlp compatible", METHOD_SETS.video()) };
      }

      const dlIcon = '<svg class="dl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
      const mIcon = '<svg class="m-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m10 8 6 4-6 4V8Z"/></svg>';
      const infoIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
      const GLYPHS = {
        video: '<path d="m10 8 6 4-6 4V8Z"/><rect x="2" y="3" width="20" height="18" rx="3"/>',
        audio: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
        image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
        locked: '<rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
      };

      let detectTimer = null;
      const history = [];

      function renderPreview(res, url) {
        $("platform").textContent = res.name;
        $("pvTitle").textContent = res.title;
        $("pvSub").textContent = res.sub;
        const thumb = $("thumb");
        thumb.classList.toggle("age", !!res.age);
        thumb.classList.toggle("nodl", !res.downloadable);
        thumb.querySelector(".glyph").innerHTML = GLYPHS[res.glyph] || GLYPHS.video;
        $("methods").innerHTML = res.downloadable && res.methods.length
          ? res.methods.map(([t, s, primary]) =>
              `<div class="method ${primary ? "primary" : ""}">${mIcon}<div class="m-main"><div class="m-t">${t}</div><div class="m-s">${s}</div></div>${dlIcon}</div>`
            ).join("")
          : `<div class="note-row">${infoIcon}<div>${res.note || res.sub}</div></div>`;
        if (!history.some((h) => h.url === url)) history.unshift({ url, name: res.name, title: res.title, downloadable: res.downloadable });
      }

      function onType() {
        const v = input.value;
        const isLink = looksLikeLink(v);
        paste.classList.toggle("hidden", v.length > 0);
        clearTimeout(detectTimer);
        if (isLink) {
          // Simulate the on-device detect: a short beat, then the paste text is
          // "accepted", the bar shrinks + lifts, preview slides in.
          detectTimer = setTimeout(() => {
            const res = detectPlatform(v);
            renderPreview(res, v);
            phone.dataset.mode = "preview";
            input.blur();
          }, 550);
        } else if (v.length === 0) {
          phone.dataset.mode = "idle";
        }
      }
      input.addEventListener("input", onType);

      // Paste button → simulate reading the clipboard with a real-ish link.
      paste.addEventListener("click", async () => {
        let text = "https://vm.tiktok.com/ZN9rED9Wge8tw-2Oe7q/";
        try { const c = await navigator.clipboard.readText(); if (looksLikeLink(c)) text = c.trim(); } catch (e) {}
        input.value = text; onType();
      });

      // ── Self-test (dev only): exercises the detector against a broad sample
      // of real-shaped URLs across every advertised platform + edge cases, and
      // reports pass/fail to the console. Re-run any time from the console via
      // window.__vortexSelfTest().
      window.__vortexSelfTest = function () {
        const cases = [
          ["https://www.tiktok.com/@zachking/video/6768504823336815877", "TikTok", true],
          ["https://vm.tiktok.com/ZN9rED9Wge8tw/", "TikTok", true],
          ["https://vt.tiktok.com/ZS6abcdef/", "TikTok", true],
          ["tiktok.com/@zachking", "TikTok", false],
          ["https://www.tiktok.com/@zachking/photo/7123456789", "TikTok", true],
          ["https://youtu.be/dQw4w9WgXcQ", "YouTube", true],
          ["https://www.youtube.com/watch?v=dQw4w9WgXcQ&t=30s", "YouTube", true],
          ["https://www.youtube.com/shorts/abc123XYZ", "YouTube", true],
          ["https://music.youtube.com/watch?v=abc123XYZ", "YouTube", true],
          ["https://www.youtube.com/@mkbhd", "YouTube", false],
          ["https://www.youtube.com/playlist?list=PL123", "YouTube", false],
          ["https://www.instagram.com/p/CzX1abc/", "Instagram", true],
          ["https://www.instagram.com/reel/CzX1abc/", "Instagram", true],
          ["https://www.instagram.com/stories/nasa/123456789/", "Instagram", true],
          ["https://www.instagram.com/nasa/", "Instagram", false],
          ["https://www.facebook.com/watch/?v=1234567890", "Facebook", true],
          ["https://fb.watch/abc123/", "Facebook", true],
          ["https://www.facebook.com/reel/1234567890", "Facebook", true],
          ["https://www.facebook.com/nasa", "Facebook", false],
          ["https://www.facebook.com/sharer/sharer.php?u=https://example.com", "Facebook", false],
          ["https://x.com/nasa/status/1234567890123456789", "X", true],
          ["https://twitter.com/nasa", "X", false],
          ["https://www.reddit.com/r/space/comments/abc123/title/", "Reddit", true],
          ["https://www.reddit.com/r/space/", "Reddit", false],
          ["https://www.reddit.com/user/spez/", "Reddit", false],
          ["https://www.pinterest.com/pin/1234567890/", "Pinterest", true],
          ["https://pin.it/abc123", "Pinterest", true],
          ["https://www.pinterest.com/nasa/space/", "Pinterest", false],
          ["https://www.linkedin.com/posts/satyanadella_activity-123", "LinkedIn", true],
          ["https://www.linkedin.com/in/satyanadella/", "LinkedIn", false],
          ["https://www.linkedin.com/company/microsoft/", "LinkedIn", false],
          ["https://www.snapchat.com/spotlight/abc123", "Snapchat", true],
          ["https://www.snapchat.com/add/nasa", "Snapchat", false],
          ["https://cdn.discordapp.com/attachments/1/2/clip.mp4", "Discord", true],
          ["https://discord.gg/abc123", "Discord", false],
          ["https://discord.com/channels/1/2", "Discord", false],
          ["https://www.threads.net/@nasa/post/CzX1abc", "Threads", true],
          ["https://www.threads.net/@nasa", "Threads", false],
          ["https://open.spotify.com/track/6habFhsOp2NvshLv26DqMb", "Spotify", true],
          ["https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M", "Spotify", false],
          ["https://soundcloud.com/artist/track-name", "SoundCloud", true],
          ["https://soundcloud.com/artist", "SoundCloud", false],
          ["https://soundcloud.com/artist/sets/album-name", "SoundCloud", false],
          ["https://clips.twitch.tv/AbcDefGhiJkl", "Twitch", true],
          ["https://www.twitch.tv/videos/1234567890", "Twitch", true],
          ["https://www.twitch.tv/ninja", "Twitch", false],
          ["https://vimeo.com/76979871", "Vimeo", true],
          ["https://vimeo.com/channels/staffpicks", "Vimeo", false],
          ["   https://youtu.be/dQw4w9WgXcQ   ", "YouTube", true],
          ["HTTPS://X.COM/nasa/status/1234567890123456789", "X", true],
          ["not a link at all", null, null],
          ["", null, null],
          ["https://example.com/some/random/page", "Media", true],
        ];
        let pass = 0, fail = 0;
        console.group("%cVortex link-detection self-test", "font-weight:bold");
        for (const [url, expectName, expectDl] of cases) {
          const link = looksLikeLink(url);
          const res = link ? detectPlatform(url) : null;
          const gotName = res ? res.name : null;
          const gotDl = res ? res.downloadable : null;
          const ok = gotName === expectName && (expectName === null || gotDl === expectDl);
          ok ? pass++ : fail++;
          console.log(ok ? "✅" : "❌", JSON.stringify(url), "→", gotName, gotDl, ok ? "" : `(expected ${expectName}, ${expectDl})`);
        }
        console.log(`${pass}/${cases.length} passed, ${fail} failed`);
        console.groupEnd();
        return { pass, fail, total: cases.length };
      };
      window.__vortexSelfTest();

      // ── Gear / theme sheet ──
      const scrim = $("scrim"), sheet = $("sheet");
      const openSheet = () => { scrim.classList.add("open"); sheet.classList.add("open"); };
      const closeSheet = () => { scrim.classList.remove("open"); sheet.classList.remove("open"); };
      $("gearBtn").addEventListener("click", openSheet);
      scrim.addEventListener("click", closeSheet);
      function setActiveTheme(t) {
        phone.dataset.theme = t;
        document.querySelectorAll(".theme-opt").forEach((o) => o.classList.toggle("active", o.dataset.t === t));
      }
      document.querySelectorAll(".theme-opt").forEach((o) =>
        o.addEventListener("click", () => { setActiveTheme(o.dataset.t); setTimeout(closeSheet, 220); }));
      setActiveTheme("dark");

      // ── History screen ──
      const hScreen = $("history");
      $("historyBtn").addEventListener("click", () => {
        const list = $("hList");
        list.innerHTML = history.length
          ? history.map((h) => `<div class="h-item"><div class="h-thumb">${mIcon.replace("m-ic", "").replace('class=""', '')}</div><div class="h-main"><div class="h-t">${h.title}</div><div class="h-s" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.url}</div></div><div class="h-plat">${h.name}</div></div>`).join("")
          : `<div style="text-align:center;color:var(--ink-3);font-size:13px;padding:60px 20px">No downloads yet.<br>Paste a link on the home screen.</div>`;
        hScreen.classList.add("open");
      });
      $("backBtn").addEventListener("click", () => hScreen.classList.remove("open"));
    </script>
  </body>
</html>
