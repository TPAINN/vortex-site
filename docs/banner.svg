<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Vortex — Paste a link. Keep the video. Free Android app, no ads, no accounts.">
<title>Vortex</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0618"/><stop offset="1" stop-color="#06121a"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#c084fc" stop-opacity=".55"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="clip"><rect width="1280" height="360" rx="22"/></clipPath>
<style>
.bar{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.4s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.3);opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 4s ease-out infinite}
@keyframes rg{0%{transform:scale(.75);opacity:.6}100%{transform:scale(1.15);opacity:0}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.glow{filter:drop-shadow(0 0 8px #c084fc)}
.blink{animation:bk 1.1s steps(2,start) infinite}
@keyframes bk{to{opacity:0}}
.sweep{animation:sw 3.4s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translateY(0)}50%{transform:translateY(272px)}}
.cell{animation:ce 3.2s ease-in-out infinite}
@keyframes ce{0%,100%{opacity:.25}50%{opacity:1}}
.scramble{animation:sc 3s ease-in-out infinite}
@keyframes sc{0%,100%{opacity:.15}30%,70%{opacity:1}}
.seg{transform-box:fill-box;transform-origin:left;animation:sg 3s ease-in-out infinite}
@keyframes sg{0%,100%{transform:scaleX(.2);opacity:.4}50%{transform:scaleX(1);opacity:1}}
.flip{transform-box:fill-box;transform-origin:center;animation:fp 5s ease-in-out infinite}
@keyframes fp{0%,40%,100%{transform:scaleX(1)}50%{transform:scaleX(.05)}60%,90%{transform:scaleX(1)}}
.ringbell{transform-box:fill-box;transform-origin:50% 8%;animation:rb 2.4s ease-in-out infinite}
@keyframes rb{0%,100%{transform:rotate(0)}15%{transform:rotate(9deg)}30%{transform:rotate(-9deg)}45%{transform:rotate(5deg)}60%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="360" fill="url(#bg)"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<circle cx="260" cy="40" r="260" fill="url(#orb)"><animate attributeName="cx" values="260;340;260" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="340" r="300" fill="url(#orb2)"><animate attributeName="cy" values="340;290;340" dur="11s" repeatCount="indefinite"/></circle>
<circle cx="1010" cy="175" r="170" fill="url(#orb)" opacity=".55"/><ellipse cx="1010" cy="175" rx="40" ry="14" fill="none" stroke="url(#g1)" stroke-width="2.2" opacity="0.95" transform="rotate(0 1010 175)"><animateTransform attributeName="transform" type="rotate" from="0 1010 175" to="360 1010 175" dur="14s" repeatCount="indefinite"/></ellipse><ellipse cx="1010" cy="175" rx="64" ry="23" fill="none" stroke="url(#g1)" stroke-width="2.0" opacity="0.85" transform="rotate(22 1010 175)"><animateTransform attributeName="transform" type="rotate" from="22 1010 175" to="-338 1010 175" dur="18s" repeatCount="indefinite"/></ellipse><ellipse cx="1010" cy="175" rx="88" ry="32" fill="none" stroke="url(#g1)" stroke-width="1.8" opacity="0.75" transform="rotate(44 1010 175)"><animateTransform attributeName="transform" type="rotate" from="44 1010 175" to="404 1010 175" dur="22s" repeatCount="indefinite"/></ellipse><ellipse cx="1010" cy="175" rx="112" ry="41" fill="none" stroke="url(#g1)" stroke-width="1.6" opacity="0.65" transform="rotate(66 1010 175)"><animateTransform attributeName="transform" type="rotate" from="66 1010 175" to="-294 1010 175" dur="26s" repeatCount="indefinite"/></ellipse><ellipse cx="1010" cy="175" rx="136" ry="50" fill="none" stroke="url(#g1)" stroke-width="1.4" opacity="0.55" transform="rotate(88 1010 175)"><animateTransform attributeName="transform" type="rotate" from="88 1010 175" to="448 1010 175" dur="30s" repeatCount="indefinite"/></ellipse><ellipse cx="1010" cy="175" rx="160" ry="59" fill="none" stroke="url(#g1)" stroke-width="1.2" opacity="0.45" transform="rotate(110 1010 175)"><animateTransform attributeName="transform" type="rotate" from="110 1010 175" to="-250 1010 175" dur="34s" repeatCount="indefinite"/></ellipse><ellipse cx="1010" cy="175" rx="184" ry="68" fill="none" stroke="url(#g1)" stroke-width="1.0" opacity="0.35" transform="rotate(132 1010 175)"><animateTransform attributeName="transform" type="rotate" from="132 1010 175" to="492 1010 175" dur="38s" repeatCount="indefinite"/></ellipse><circle class="pulse" cx="1010" cy="175" r="10" fill="#fff"/>
<text x="72" y="140" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#tt)">Vortex</text>
<text x="72" y="200" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">Paste a link. Keep the video. Free Android app, no</text><text x="72" y="232" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">ads, no accounts.</text>
<g transform="translate(72 292)"><rect width="104" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#c084fc" stroke-opacity=".45"/><text x="52" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">React 19</text></g><g transform="translate(186 292)"><rect width="122" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#c084fc" stroke-opacity=".45"/><text x="61" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">Tailwind 4</text></g><g transform="translate(318 292)"><rect width="150" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#c084fc" stroke-opacity=".45"/><text x="75" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">Framer Motion</text></g><g transform="translate(477 292)"><rect width="76" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#c084fc" stroke-opacity=".45"/><text x="38" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">Lenis</text></g>
<rect x="1" y="1" width="1278" height="358" rx="21" fill="none" stroke="url(#g1)" stroke-opacity=".35" stroke-width="1.5"/>
</g>
</svg>
